<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign In • PBSNC Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/site.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --royal:#0b2b7e; --royal-700:#1D4ED8; }
    body { 
      font-family: system-ui,-apple-system,'Segoe UI',Roboto;
      background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.45) 100%), 
                  url('/img/board-pic.jpg') center/cover fixed no-repeat;
      background-color: #f8f9fa;
    }
    .auth-container { max-width: 500px; margin: 40px auto; }
    .auth-card { box-shadow: 0 .25rem .75rem rgba(0,0,0,.05); border-radius: 12px; }
    .error-badge { background: #fee2e2; color: #7f1d1d; padding: 12px; border-radius: 8px; border-left: 4px solid #ef4444; }
    .form-label {
      font-weight: 500;
      margin-bottom: 0.5rem;
    }
    .mb-3 small {
      display: block;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <!-- Nav -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand d-flex align-items-center brand" href="/">
        <img src="/img/nc-crest.png" alt="NC Crest" onerror="this.style.display='none'">
        <span>PBSNC Portal</span>
      </a>
      <a class="nav-link" href="/auth/register.html">Create Account</a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card card mb-4">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Sign In</h2>
        <p class="text-muted small mb-4">Enter your username and password to access the portal.</p>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="username" type="text" class="form-control" placeholder="Enter username" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" placeholder="Enter password" required>
          </div>

          <div id="loginAlert"></div>

          <div class="d-flex gap-2 mt-4">
            <a href="/" class="btn btn-outline-secondary">Back</a>
            <button type="submit" class="btn btn-primary ms-auto">Sign In</button>
          </div>
        </form>

        <p class="text-center small text-muted mt-3 mb-0">
          Don't have an account? <a href="/auth/register.html">Create one</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alertDiv = document.getElementById('loginAlert');
      const btn = e.target.querySelector('button[type="submit"]');

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      alertDiv.innerHTML = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          alertDiv.innerHTML = `<div class="error-badge">${data.error || 'Invalid credentials.'}</div>`;
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        // Success: store token and redirect
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/chapters.html';
      } catch (err) {
        alertDiv.innerHTML = `<div class="error-badge">Error: ${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>

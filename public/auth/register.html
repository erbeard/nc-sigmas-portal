<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Create Account • PBSNC Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/site.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --royal:#0b2b7e; --royal-700:#1D4ED8; }
    body { 
      font-family: system-ui,-apple-system,'Segoe UI',Roboto;
      background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.45) 100%), 
                  url('/img/board-pic.jpg') center/cover fixed no-repeat;
      background-color: #f8f9fa;
    }
    .auth-container { max-width: 500px; margin: 40px auto; }
    .auth-card { box-shadow: 0 .25rem .75rem rgba(0,0,0,.05); border-radius: 12px; }
    .success-badge { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; border-left: 4px solid #10b981; }
    .error-badge { background: #fee2e2; color: #7f1d1d; padding: 12px; border-radius: 8px; border-left: 4px solid #ef4444; }

    /* User info banner (green validated box) */
    .user-info-banner {
      background: #d1fae5;
      border: 1px solid #6ee7b7;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      color: #065f46;
    }
    .user-info-banner strong {
      font-weight: 700;
      display: block;
      font-size: 1.1rem;
      margin-bottom: 0.35rem;
    }

    /* Disabled/read-only email field styling */
    input:disabled,
    input[readonly] {
      background-color: #f3f4f6;
      color: #6b7280;
      cursor: not-allowed;
      border-color: #d1d5db;
    }
    input:disabled::placeholder,
    input[readonly]::placeholder {
      color: #9ca3af;
    }

    .form-label {
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .mb-3 small {
      display: block;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <!-- Nav -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand d-flex align-items-center brand" href="/">
        <img src="/img/nc-crest.png" alt="NC Crest" onerror="this.style.display='none'">
        <span>PBSNC Portal</span>
      </a>
      <a class="nav-link" href="/auth/login.html">Sign in</a>
    </div>
  </nav>

  <div class="auth-container">
    <!-- STEP 1: Identify Brother -->
    <div id="step1" class="auth-card card mb-4">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Create User Account</h2>
        <p class="text-muted small mb-4">Complete the form below to identify the brother for which you want to create a user account.</p>

        <form id="identifyForm">
          <div class="mb-3">
            <label class="form-label">Membership ID</label>
            <input id="membershipId" type="text" class="form-control" placeholder="e.g., 12345" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="identifyEmail" type="email" class="form-control" placeholder="you@example.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Chapter</label>
            <select id="chapterId" class="form-select" required>
              <option value="">Select your chapter…</option>
            </select>
          </div>

          <div id="identifyAlert"></div>

          <div class="d-flex gap-2 mt-4">
            <a href="/auth/login.html" class="btn btn-outline-secondary">Return to Login</a>
            <button type="submit" class="btn btn-primary ms-auto">Identify Brother</button>
          </div>
        </form>
      </div>
    </div>

    <!-- STEP 2: Create Account (shown after successful identify) -->
    <div id="createAccountStep" class="auth-card card" style="display:none;">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Create Account</h2>

        <!-- User info display -->
        <div class="user-info-banner mb-4">
          <strong id="displayName">—</strong>
          <div id="displayChapter" class="text-muted small">—</div>
          <div id="displayMemberId" class="text-muted small">—</div>
        </div>

        <!-- Form -->
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">User Name</label>
            <input id="username" type="text" class="form-control" placeholder="Choose username" required minlength="3">
            <small class="text-muted">3+ characters, letters and numbers only</small>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="registerEmail" type="email" class="form-control" readonly>
            <small class="text-muted">From your member record (cannot be changed)</small>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <input id="password" type="password" class="form-control" placeholder="Minimum 8 characters" required minlength="8">
              <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                <span class="toggle-icon">👁</span>
              </button>
            </div>
            <small class="text-muted">Must be at least 8 characters</small>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input id="confirmPassword" type="password" class="form-control" placeholder="Re-enter password" required>
          </div>

          <div id="registerAlert" class="alert-placeholder"></div>

          <div class="d-flex gap-2 mt-4">
            <button type="button" class="btn btn-secondary" onclick="resetFlow()">Back</button>
            <button type="submit" class="btn btn-primary ms-auto">Create Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    let identifiedBrother = null;

    // Safely parse JSON responses
    async function safeJson(response) {
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch (err) {
        console.error('Response text:', text);
        throw new Error(`Invalid JSON response: ${text.substring(0, 100)}`);
      }
    }

    // Load chapters on page load
    async function loadChapters() {
      try {
        const res = await fetch('/api/chapters');
        const chapters = await safeJson(res);
        const select = document.getElementById('chapterId');
        chapters.forEach(ch => {
          const opt = document.createElement('option');
          opt.value = ch.id;
          opt.textContent = ch.name;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Failed to load chapters:', err);
        document.getElementById('chapterId').innerHTML += '<option value="">Error loading chapters</option>';
      }
    }

    // STEP 1: Identify Brother
    document.getElementById('identifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const membershipId = document.getElementById('membershipId').value.trim();
      const email = document.getElementById('identifyEmail').value.trim();
      const chapterId = document.getElementById('chapterId').value;
      const alertDiv = document.getElementById('identifyAlert');

      alertDiv.innerHTML = '<div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">Loading…</span></div>';

      try {
        const res = await fetch('/api/auth/identify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ member_number: membershipId, email, chapter_id: chapterId })
        });

        const data = await safeJson(res);
        console.log('Identify response:', data);

        if (!res.ok) {
          alertDiv.innerHTML = `<div class="error-badge">${data.error || 'Brother not found.'}</div>`;
          return;
        }

        // ✅ Store the identified member data FIRST before showing form
        window.identifiedMember = {
          id: data.id,
          name: data.name,
          email: data.email,
          member_number: data.member_number,
          chapter_id: data.chapter_id,
          chapter: data.chapter
        };

        console.log('Stored identifiedMember:', window.identifiedMember);

        // Populate create account form with data from identify response
        document.getElementById('displayName').textContent = data.name || '—';
        document.getElementById('displayChapter').textContent = data.chapter || '—';
        document.getElementById('displayMemberId').textContent = `Tau Epsilon Sigma • Member #${data.member_number}`;
        
        // Set email field to database value and make read-only
        document.getElementById('registerEmail').value = data.email || email;
        
        // Show create account form
        document.getElementById('step1').style.display = 'none';
        document.getElementById('createAccountStep').style.display = 'block';
        alertDiv.innerHTML = '';
      } catch (err) {
        console.error('Identify error:', err);
        alertDiv.innerHTML = `<div class="error-badge">Error: ${err.message}</div>`;
      }
    });

    // STEP 2: Register Form
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // ✅ Check if identifiedMember exists before accessing
      if (!window.identifiedMember) {
        alert('Session lost. Please start over by identifying yourself first.');
        resetFlow();
        return;
      }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const email = document.getElementById('registerEmail').value.trim();
      const alertDiv = document.getElementById('registerAlert');

      console.log('Register - identifiedMember:', window.identifiedMember);

      // Validation
      if (!username) {
        alertDiv.innerHTML = '<div class="error-badge">Username is required.</div>';
        return;
      }
      if (username.length < 3) {
        alertDiv.innerHTML = '<div class="error-badge">Username must be at least 3 characters.</div>';
        return;
      }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        alertDiv.innerHTML = '<div class="error-badge">Username can only contain letters, numbers, and underscores.</div>';
        return;
      }
      if (!email) {
        alertDiv.innerHTML = '<div class="error-badge">Email is required.</div>';
        return;
      }
      if (!password) {
        alertDiv.innerHTML = '<div class="error-badge">Password is required.</div>';
        return;
      }
      if (password.length < 8) {
        alertDiv.innerHTML = '<div class="error-badge">Password must be at least 8 characters.</div>';
        return;
      }
      if (!confirmPassword) {
        alertDiv.innerHTML = '<div class="error-badge">Please confirm your password.</div>';
        return;
      }
      if (password !== confirmPassword) {
        alertDiv.innerHTML = '<div class="error-badge">Passwords do not match.</div>';
        return;
      }

      alertDiv.innerHTML = '<div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">Creating account…</span></div>';

      const payload = {
        username,
        password,
        member_number: window.identifiedMember.member_number,
        email: email,
        chapter_id: window.identifiedMember.chapter_id
      };

      console.log('Sending payload:', payload);

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await safeJson(res);
        console.log('Register response:', { status: res.status, data });

        if (!res.ok) {
          alertDiv.innerHTML = `<div class="error-badge">${data.error || 'Registration failed.'}</div>`;
          return;
        }

        alertDiv.innerHTML = `<div class="success-badge">✓ Account created! Welcome ${username}.</div>`;
        document.getElementById('registerForm').style.display = 'none';
        
        const successMsg = document.createElement('div');
        successMsg.className = 'alert alert-success mt-3';
        successMsg.innerHTML = `
          <strong>Account Created Successfully!</strong><br>
          Your account is ready to use. You can now log in with your username and password.
        `;
        document.getElementById('createAccountStep').appendChild(successMsg);

        setTimeout(() => {
          window.location.href = '/auth/login.html';
        }, 2000);

      } catch (err) {
        console.error('Registration request error:', err);
        alertDiv.innerHTML = `<div class="error-badge">Error: ${err.message}</div>`;
      }
    });

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', () => {
      const input = document.getElementById('password');
      const icon = document.querySelector('.toggle-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈';
      } else {
        input.type = 'password';
        icon.textContent = '👁';
      }
    });

    function resetFlow() {
      document.getElementById('step1').style.display = 'block';
      document.getElementById('createAccountStep').style.display = 'none';
      window.identifiedMember = null;
    }

    // Load chapters when page loads
    loadChapters();
  </script>
</body>
</html>
